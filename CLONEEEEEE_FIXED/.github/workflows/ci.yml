name: Java CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        run: mvn -f backend/pom.xml test
      - name: Compile frontend
        run: mvn -f frontend/pom.xml -DskipTests package
