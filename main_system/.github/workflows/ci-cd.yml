name: Java CI/CD Pipeline for Auction System

# Kích hoạt tự động khi Push hoặc Pull Request vào nhánh main/master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Máy ảo Ubuntu của GitHub

    steps:
      # 1. Tải code của bạn về máy ảo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Cài đặt Java 21 (Theo đúng phiên bản bạn đang dùng ở máy)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Cache lại thư viện để các lần chạy sau nhanh hơn

      # 3. Chạy Unit Test và Build cho Backend
      - name: Build and Test Backend
        run: mvn -B clean package --file backend/pom.xml

      # 4. Chạy Unit Test và Build cho Frontend
      - name: Build and Test Frontend
        run: mvn -B clean package --file frontend/pom.xml

      # 5. Lưu lại file chạy (.jar) của Backend sau khi build thành công
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Backend-App
          path: backend/target/*.jar

      # 6. Lưu lại file chạy (.jar) của Frontend sau khi build thành công
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frontend-App
          path: frontend/target/*.jar